name: Build Android APK

# Push to main  -> signed APK as a workflow artifact (for testing).
# An explicit "release: vX.Y.Z" commit on main also publishes after tests and the build pass.
# Push a v* tag -> signed APK published as a GitHub Release (phones update from here via Obtainium).
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: [ '**.md', 'VERSION.txt', '.gitignore' ]
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore: [ '**.md', 'VERSION.txt', '.gitignore', ]

# A newer push to main cancels the older, still-running build. Tag (release) builds are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            node --input-type=module --check < "$file"
          done < <(find app/src/main/assets/js -name '*.js' -print0)
      - name: Run playback and source regression tests
        run: node --experimental-vm-modules --test tools/regressions.test.mjs

  android_check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile Android debug sources
        run: gradle --no-daemon :app:compileDebugKotlin --stacktrace
      - name: Run Android lint
        run: |
          if ! gradle --no-daemon :app:lintDebug --stacktrace; then
            cat app/build/reports/lint-results-debug.txt 2>/dev/null || true
            exit 1
          fi

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Read version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi
          PUBLISH_RELEASE=false
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            PUBLISH_RELEASE=true
          elif [[ "$GITHUB_REF" == "refs/heads/main" && "$(git log -1 --pretty=%s)" == "release: v$VERSION" ]]; then
            PUBLISH_RELEASE=true
          fi
          echo "PUBLISH_RELEASE=$PUBLISH_RELEASE" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Missing SIGNING_KEYSTORE_BASE64 secret"; exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          # lets the app file problem reports as issues here (optional: without it the app links to GitHub)
          VEO_ISSUES_TOKEN: ${{ secrets.VEO_ISSUES_TOKEN }}
        run: |
          gradle --no-daemon :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "VEO-v$VERSION.apk"
          # fixed name for a short, permanent download link (…/releases/latest/download/VEO.apk), e.g. for TVs
          cp app/build/outputs/apk/release/app-release.apk VEO.apk

      # An x86_64-capable build, so the app (torrents included) can be tested in a PC emulator.
      # Only a release needs it: on an ordinary push it is a second full build nobody downloads.
      - name: Build debug APK for emulators
        if: env.PUBLISH_RELEASE == 'true'
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk VEO-emulator.apk

      - name: Upload emulator APK artifact
        if: env.PUBLISH_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VEO-emulator-v${{ env.VERSION }}
          path: VEO-emulator.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VEO-v${{ env.VERSION }}
          path: VEO-v${{ env.VERSION }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | \
            awk -v tag="refs/tags/$TAG" '$2 == tag {direct=$1} $2 == tag "^{}" {peeled=$1} END {print peeled ? peeled : direct}')
          if [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error::Refusing to publish: $TAG points to a different commit"
            exit 1
          fi
          NOTES_FILE="releases/$TAG.md"
          if [ ! -f "$NOTES_FILE" ]; then
            NOTES_FILE="$RUNNER_TEMP/release-notes.md"
            awk "/^## $VERSION/{f=1;next} /^## /{f=0} f" CHANGELOG.md > "$NOTES_FILE"
            if [ ! -s "$NOTES_FILE" ]; then echo "Release $TAG" > "$NOTES_FILE"; fi
          fi
          # An absent tag is created at the exact commit whose APK and tests passed, never at a moving main.
          gh release create "$TAG" "VEO-v$VERSION.apk" VEO.apk VEO-emulator.apk \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VEO $TAG" --notes-file "$NOTES_FILE"

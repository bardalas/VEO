<link media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=Rubik:wght@500;700;800&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// Apply saved skin/layout/language before first paint (Settings page). TV devices default to the TV layout.
const RTL_LANGS = ['he', 'ar', 'fa', 'ur'];
const dirOf = l => RTL_LANGS.includes(l) ? 'rtl' : 'ltr';
// The settings are the profile's this page is opened in (js/core/store.js), or from before there were profiles.
// The kids profile's tier mirrors kidsTier() in js/core/settings.js.
try{
  const pid = JSON.parse(localStorage.getItem('booth:profile') || '"p1"'), r = document.documentElement;
  const s = JSON.parse(localStorage.getItem('booth:p/' + pid + '/settings') || localStorage.getItem('booth:settings') || '{}');
  r.lang = s.uiLang || 'he'; r.dir = dirOf(r.lang);
  const age = {young: 6, kids: 9, older: 12, teen14: 14, teen16: 16, adult18: 18}[s.kidsAge] || 9;
  r.dataset.skin = ['veo','midnight','netflix','daylight','custom'].includes(s.skin) ? s.skin : 'veo'; r.dataset.layout = 'tv'; r.dataset.poster = s.poster || 'm'; r.dataset.nosrc = s.nosrc || 'grey';
  r.dataset.kids = s.kids !== 'on' ? 'off' : age >= 16 ? 'teen16' : age >= 14 ? 'teen' : 'child';
}catch(e){}
</script>
